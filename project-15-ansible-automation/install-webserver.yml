---
- name: Install Web Server
  hosts: webservers
  become: yes

  tasks:

    - name: Install Apache
      apt:
        name: apache2
        state: present
      when: ansible_os_family == "Debian"

    - name: Start Apache
      service:
        name: apache2
        state: started
        enabled: yes
      when: ansible_os_family == "Debian"
